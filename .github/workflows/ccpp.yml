name: FVWM3 CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 20
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container:
      image: ${{ matrix.os == 'alpine' && 'fvwmorg/fvwm3-build-alpine:latest' || 'fvwmorg/fvwm3-build:latest' }}
    env:
      GO111MODULE: "on"

    strategy:
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, alpine]
        compiler: [gcc, clang]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure and Build
        run: |
          export CC=${{ matrix.compiler }}
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            export CFLAGS="-flto -Werror=odr -Werror=lto-type-mismatch -Werror=strict-aliasing"
          else
            export CC_LD=lld
          fi
          meson setup builddir --buildtype=debugoptimized -Dhtmldoc=true -Dmandoc=true
          meson compile -C builddir
          meson test -C builddir --print-errorlogs

  sanitizers:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    container:
      image: fvwmorg/fvwm3-build:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and test with sanitizers
        env:
          CC: gcc
        run: |
          meson setup builddir \
            --buildtype=debug \
            -Dgolang=disabled \
            -Db_sanitize=address,undefined
          meson compile -C builddir
          meson test -C builddir --print-errorlogs
