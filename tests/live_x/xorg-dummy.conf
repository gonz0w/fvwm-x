Section "ServerLayout"
    Identifier "FVWM-X Live-X Layout"
    Screen 0 "FVWM-X Dummy Screen"
EndSection

Section "Device"
    Identifier "FVWM-X Dummy Device"
    Driver "dummy"
    VideoRam 256000
EndSection

Section "Monitor"
    Identifier "FVWM-X Dummy Monitor"
    HorizSync 5.0-1000.0
    VertRefresh 5.0-200.0
    Modeline "1920x1080" 172.80 1920 2040 2248 2576 1080 1081 1084 1118
    Modeline "1280x1024" 109.00 1280 1368 1496 1712 1024 1027 1034 1063
    Modeline "1024x768" 65.00 1024 1048 1184 1344 768 771 777 806
EndSection

Section "Screen"
    Identifier "FVWM-X Dummy Screen"
    Device "FVWM-X Dummy Device"
    Monitor "FVWM-X Dummy Monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080" "1280x1024" "1024x768"
        Virtual 4096 2160
    EndSubSection
EndSection
